[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmpivot"
version = "0.1.1"
description = "Runtime prompt control and versioning for production apps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Sanath Goutham", email = "sanathgoutham@gmail.com" }
]
keywords = ["prompts", "llm", "prompt-management", "fastapi", "versioning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
server = ["uvicorn>=0.29.0"]

[project.urls]
Homepage = "https://github.com/Lancer59/llmpivot"
Repository = "https://github.com/Lancer59/llmpivot"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmpivot*"]
