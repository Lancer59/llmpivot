[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmpivot"
version = "0.3.0"
description = "Versioned prompts and Agent Skills with progressive context loading for production LLM apps"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Sanath Goutham", email = "sanathgoutham@gmail.com" }
]
keywords = ["prompts", "agent-skills", "llm", "progressive-context", "fastapi", "versioning", "mongodb", "rbac", "instruction-studio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
server = ["uvicorn>=0.29.0"]
mongo = ["motor>=3.3.0", "pymongo>=4.6.0"]
security = ["argon2-cffi>=23.1.0"]
all = ["uvicorn>=0.29.0", "motor>=3.3.0", "pymongo>=4.6.0", "argon2-cffi>=23.1.0"]

[project.urls]
Homepage = "https://github.com/Lancer59/llmpivot"
Repository = "https://github.com/Lancer59/llmpivot"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmpivot*"]
